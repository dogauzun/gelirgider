<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The surface token from src/index.css; metas cannot read CSS
         variables. Follows the OS theme, not an explicit in-app choice. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161a22" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Blocking, before the stylesheet: applies the stored theme before first
         paint (public/theme.js). -->
    <script src="/theme.js"></script>
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/InterVariable-latin.woff2"
    />
    <title>gelirgider</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
