name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: Title
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check the title against the CLAUDE.md "PR format"
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # No task key: the task's PR property in Notion links the task to the PR (CLAUDE.md rule 10).
          re='^(feat|fix|perf|refactor|test|docs|build|chore): [[:lower:]`].*$'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "Title:    $TITLE"
            echo "Expected: <feat|fix|perf|refactor|test|docs|build|chore>: <lowercase imperative>"
            exit 1
          fi
