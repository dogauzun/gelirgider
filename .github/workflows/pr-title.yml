name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: Title
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check the title against the CLAUDE.md "PR format"
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The (GLG-<n>) suffix is optional: a PR without a GLG ticket drops it.
          re='^(feat|fix|perf|refactor|test|docs|build|chore): [[:lower:]`].*( \(GLG-[0-9]+\))?$'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "Title:    $TITLE"
            echo "Expected: <feat|fix|perf|refactor|test|docs|build|chore>: <lowercase imperative> [(GLG-<n>)]"
            exit 1
          fi
