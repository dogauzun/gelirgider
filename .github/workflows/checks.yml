# The check set of docs/PRINCIPLES.md #6. The Makefile says what each check
# runs; this file only installs the toolchains and calls the target.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lint, test-backend, test-frontend, build-frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: matrix.target == 'lint' || matrix.target == 'test-backend'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        if: matrix.target != 'test-backend'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: matrix.target != 'test-backend'
        working-directory: frontend
      - run: make ${{ matrix.target }}
