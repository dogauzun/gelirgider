# Publishes the backend and frontend images to ghcr.io (ADR 0020): `latest`
# and `sha-<7>` on a push to main; `vX.Y.Z` plus the floating major `vX` on a
# `v*` tag push or when release.yml calls this workflow with `version` (a tag
# created with GITHUB_TOKEN fires no push event, so the call is explicit). The
# version, or `sha-<7>` on main, goes into the build as `--build-arg VERSION`.
# Plain docker commands in `run:` steps, because the Actions policy allows
# GitHub-owned actions only. One `docker buildx build` publishes each image for
# linux/amd64 and linux/arm64 (the Go binary cross-compiles and the frontend
# bundle is architecture-independent, so no emulation). Attestations are off, so
# the index holds only the two platforms.
name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_call:
    inputs:
      version:
        description: Release tag to publish (vX.Y.Z)
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker buildx create --use
      - name: Build and push
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}"
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          fi
          if [ -n "$version" ]; then
            tags="$version ${version%%.*}"
          else
            version="sha-${GITHUB_SHA::7}"
            tags="latest $version"
          fi
          args=()
          for t in $tags; do args+=(-t "$name:$t"); done
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --provenance=false \
            -f deploy/${{ matrix.image }}.Dockerfile \
            --build-arg VERSION="$version" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.licenses=AGPL-3.0-only \
            "${args[@]}" .
