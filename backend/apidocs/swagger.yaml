          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: List upcoming dividends
      tags:
      - dividends
  /portfolios/{id}/goal:
    delete:
      parameters:
      - description: numeric id or `all`
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: deleted
        "404":
          description: portfolio not found; goal not found
          schema:
            properties:
              error:
