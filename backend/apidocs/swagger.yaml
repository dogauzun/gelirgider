        type: string
      fees:
        type: string
      interest:
        type: string
      net_contribution:
        description: |-
          deposits less withdrawals, and dividends_gross less dividends_tax,
          each worked out unrounded and rounded once, so either can differ from
          the rounded fields' difference by a cent.
        type: string
      withdrawals:
        type: string
    type: object
  server.statsResponse:
    properties:
      by_currency:
        additionalProperties:
          $ref: '#/definitions/server.statsFields'
        description: One entry per currency any row moved, in that currency.
        type: object
      first_transaction_date:
        description: The earliest transaction date in scope; null with no transactions.
        type: string
      reporting:
        allOf:
        - $ref: '#/definitions/server.statsFields'
        description: |-
          by_currency summed into the reporting currency at today's rate. Null
          when any by_currency entry with a nonzero figure has no rate, rather
          than a partial sum; missing_rates names that currency.
    type: object
  server.summaryResponse:
    properties:
      cash:
        type: string
      cash_by_currency:
        additionalProperties:
          type: string
        type: object
      cash_by_currency_reporting:
        additionalProperties:
          type: string
        description: |-
          Each cash_by_currency entry converted into the reporting currency,
          keyed by its own currency. A currency with no rate is left out; it is
          named in missing_rates.
        type: object
      cost_basis:
        type: string
      currency:
        type: string
      day_change:
        description: |-
          The open positions' day_change_reporting, plus the move on price_date
          of closed positions sold out on or after it, summed unrounded and
          rounded once, so it can differ from the rounded rows' sum by a cent.
          A position with no previous close or no rate is left out; null when
          none is left, so the page shows "-" rather than a zero.
        type: string
      fx_pl:
        description: |-
          FXPL is the part of the return that neither P/L figure holds: the
          currency move on foreign cash and on the cost of foreign positions,
          both of which unrealized and realized P/L value at today's rate.
          Null when the portfolio has no currency other than the
          reporting one, or when every such currency was excluded for lack of a
          rate -- the same rule as the P/L fields above.
        type: string
      missing_rates:
        items:
          type: string
        type: array
      positions:
        items:
          $ref: '#/definitions/server.positionResponse'
        type: array
      positions_value:
        description: |-
          The open positions' market value and cost in the reporting currency,
          leaving out the same missing_rates currencies as total_value. Each is
          summed unrounded and rounded once, so it matches the rows and history's
          cost_basis; total_value less cash less unrealized_pl, each already
          rounded, can be a cent off.
        type: string
      realized_pl:
        type: string
      stats:
        $ref: '#/definitions/server.statsResponse'
      total_value:
        type: string
      unrealized_pl:
        description: |-
          Null when every currency contributing to the total was excluded for
          lack of a rate (see totalKnown): the sum is then 0.00, which reads as
          a real zero next to the per-position figures. The caller renders "-"
          instead, the way it already does for a position with no reporting
          value. Cash and total value stay plain strings: the page can tell the
          same thing for those from cash_by_currency and market_value_reporting,
          but realized P/L also counts closed positions, whose
          currencies reach no other field of this response.
        type: string
    type: object
  statement.aliasRequest:
    properties:
      instrument_id:
        type: integer
      symbol:
        type: string
    type: object
  statement.cashReconcileEntry:
    properties:
      currency:
        type: string
      match:
        type: boolean
      portfolio_amount:
        type: string
      statement_amount:
        type: string
    type: object
  statement.commitRequest:
    properties:
      aliases:
        items:
          $ref: '#/definitions/statement.aliasRequest'
        type: array
      broker:
        type: string
      currency:
        type: string
      names:
        items:
          $ref: '#/definitions/statement.aliasRequest'
        type: array
      period_end:
        type: string
      period_start:
        type: string
      portfolio_id:
        type: integer
      rows:
        items:
          $ref: '#/definitions/transaction.Request'
        type: array
      sha256:
        type: string
    type: object
  statement.commitResponse:
    properties:
      id:
        type: integer
      period_end:
        type: string
      period_start:
        type: string
      transaction_count:
        type: integer
    type: object
  statement.fundResponse:
    properties:
      currency:
        type: string
      id:
        type: integer
      market:
        type: string
      name:
        type: string
      symbol:
        type: string
    type: object
  statement.holdingResponse:
    properties:
      avg_cost:
        type: string
      currency:
        type: string
      quantity:
        type: string
      symbol:
        type: string
    type: object
  statement.importResponse:
    properties:
      broker:
        type: string
      created_at:
        type: string
      currency:
        description: |-
          Currency is the statement's account currency, "" when unknown or a
          CSV. It tells the TRY and USD statements of the same month apart.
        type: string
      id:
        type: integer
      period_end:
        type: string
      period_start:
        type: string
      portfolio_id:
        type: integer
      transaction_count:
        type: integer
    type: object
  statement.previewResponse:
    properties:
      broker:
        type: string
      cash_reconciliation:
        allOf:
        - $ref: '#/definitions/statement.cashReconcileEntry'
        description: |-
          CashReconciliation is null when the statement printed no cash
          balance or no currency.
      currency:
        type: string
      holdings:
        items:
          $ref: '#/definitions/statement.holdingResponse'
        type: array
      names:
        description: |-
          Names are the fund names the balances printed, each once with the
          instrument of its code (0: see statementNames), in the shape of
          commit's aliases, for the client to send back as commit's names.
          Left out for a statement that prints none.
        items:
          $ref: '#/definitions/statement.aliasRequest'
        type: array
      period_end:
        type: string
      period_start:
        type: string
      reconciliation:
        items:
          $ref: '#/definitions/statement.reconcileEntry'
        type: array
      rows:
        items:
          $ref: '#/definitions/statement.previewRow'
        type: array
      sha256:
        type: string
      warnings:
        items:
          $ref: '#/definitions/statement.warning'
        type: array
    type: object
  statement.previewRow:
    properties:
      amount:
        type: string
      approximate_price:
        description: |-
          ApproximatePrice marks an opening buy priced with the statement's own
          period-end price, as no stored price exists for its date.
        type: boolean
      closing:
        description: |-
          Closing marks a sell the preview proposes, dated the day before
          period_start, for what the portfolio holds and the statement does not.
          It starts unchecked: the gap may be months not imported.
        type: boolean
      code:
        type: string
      cost_price:
        description: |-
          CostPrice marks an opening buy priced with the average cost the
          statement prints for the holding.
        type: boolean
      currency:
        type: string
      currency_fallback:
        description: |-
          CurrencyFallback marks a row the file gave no currency for: Currency
          is the instrument's, TRY when none, so a pick in the page
          takes the picked instrument's.
        type: boolean
      date:
        type: string
      description:
        type: string
      duplicate_of:
        description: |-
          DuplicateOf is the date of an earlier transaction, hand-entered or
          imported, this row likely repeats (see flagDuplicates); the client
          starts such a row unchecked.
        type: string
      fee:
        type: string
      instrument_id:
        type: integer
      instrument_name:
        type: string
      instrument_symbol:
        description: |-
          InstrumentSymbol and InstrumentName name the instrument of a row
          resolved by an earlier pick, whose symbol is the statement's own, so
          the user sees what the pick resolved it to.
        type: string
      key:
        type: string
      market:
        description: |-
          Market is the row's own market hint, as a CSV row can carry one; empty
          when it has none.
        type: string
      message:
        type: string
      opening:
        description: |-
          Opening marks a row the preview proposes for what the account held
          before period_start: a buy dated the day before it, or the deposit
          that pays for those buys.
        type: boolean
      price:
        type: string
      quantity:
        type: string
      raw:
        items:
          type: string
        type: array
      reason:
        type: string
      resolved_by:
        description: |-
          ResolvedBy is "alias" when the instrument is the user's own earlier
          pick for this symbol rather than a match of it, "name" when
          it is the fund an earlier statement's balances printed under this name.
        type: string
      section:
        type: string
      status:
        type: string
      symbol:
        type: string
      type:
        type: string
      unknown_instrument:
        description: |-
          UnknownInstrument marks an error row whose symbol is unknown as well,
          so the preview still says so once checkRow made it an error.
        type: boolean
      value:
        type: string
    type: object
  statement.reconcileEntry:
    properties:
      instrument_id:
        type: integer
      match:
        type: boolean
      portfolio_quantity:
        type: string
      statement_quantity:
        type: string
      symbol:
        type: string
    type: object
  statement.warning:
    properties:
      code:
        type: string
      import_id:
        type: integer
      message:
        type: string
      period_end:
        type: string
      period_start:
        type: string
    type: object
  transaction.Request:
    properties:
      amount:
        type: string
      currency:
        type: string
      date:
        type: string
      fee:
        type: string
      instrument_id:
        description: |-
          InstrumentID is required for buy and sell, optional for dividend (a
          dividend with none is interest income), and rejected for the rest.
        type: integer
      note:
        type: string
      price:
        type: string
      quantity:
        type: string
      type:
        type: string
    type: object
  transaction.transactionResponse:
    properties:
      amount:
        type: string
      created_at:
        type: string
      currency:
        type: string
      date:
        type: string
      fee:
        type: string
      id:
        type: integer
      import_id:
        description: |-
          ImportID is null for a hand-entered transaction, set for one that came
          from a broker statement import.
        type: integer
      instrument_id:
        type: integer
      instrument_name:
        type: string
      instrument_symbol:
        type: string
      note:
        type: string
      portfolio_id:
        type: integer
      price:
        type: string
      quantity:
        type: string
      type:
        type: string
    type: object
info:
  contact: {}
  description: |-
    Auth is the `session` cookie set by `POST /api/auth/login`; routes that need it answer 401 without it. Swagger 2.0 has no cookie security scheme, so the spec declares none.
    Routes under `/api/admin/` answer 403 `admin only` for a signed-in non-admin.
    Every error body is `{"error": "<message>"}`.
    Request bodies are capped at 64 KB, except the two statement import routes; a larger body with a declared Content-Length answers 413 `request body: larger than 64 KB`; one sent without a length is cut off at 64 KB and answers the route's 400.
    Rate-limited routes answer 429 `too many requests` with a `Retry-After` header.
    A POST, PUT, PATCH or DELETE from another origin answers 403 `cross-origin request`.
  title: gelirgider API
  version: "1"
paths:
  /account/password:
    post:
      consumes:
      - application/json
      description: Needs a session. Signs out every other session of the user. Rate-limited
        per client IP, 10 per minute.
      parameters:
      - description: current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.changePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request body; password must not be only whitespace;
            password must be at least 8 characters; password must be at most 72 bytes
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: current password is incorrect; unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Change own password
      tags:
      - auth
  /account/totp:
    delete:
      consumes:
      - application/json
      description: Needs a session, the current password and a current code, so a
        stolen session alone cannot drop the second factor. The code is a 6-digit
        authenticator code or an unused recovery code. An authenticator code at or
        below the last accepted step is a replay and is rejected. Deletes the user's
        recovery codes. Rate-limited per client IP, 10 per minute.
      parameters:
      - description: current password and a 6-digit code from the authenticator or
          a recovery code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.totpDisableRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request body; invalid code
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: current password is incorrect; unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: two-factor authentication is off
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Turn two-factor authentication off
      tags:
      - auth
  /account/totp/confirm:
    post:
      consumes:
      - application/json
      description: Needs a session. Checks the code against the pending secret, turns
        two-factor on and returns 10 one-time recovery codes, shown only this once.
        Signs out every other session of the user. Rate-limited per client IP, 10
        per minute.
      parameters:
      - description: 6-digit code from the authenticator
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.totpConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.recoveryCodesResponse'
        "400":
          description: invalid request body; invalid code
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: no pending two-factor setup
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Confirm two-factor enrolment
      tags:
      - auth
  /account/totp/recovery-codes:
    post:
      consumes:
      - application/json
      description: Needs a session, the current password and a current code (a 6-digit
        authenticator code or an unused recovery code). Replaces all of the user's
        recovery codes with 10 new ones in one transaction and returns them; they
        are shown only this once. Rate-limited per client IP, 10 per minute.
      parameters:
      - description: current password and a 6-digit code from the authenticator or
          a recovery code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.totpDisableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.recoveryCodesResponse'
        "400":
          description: invalid request body; invalid code
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: current password is incorrect; unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: two-factor authentication is off
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Regenerate recovery codes
      tags:
      - auth
  /account/totp/setup:
    post:
      consumes:
      - application/json
      description: Needs a session and the current password, so a stolen session cannot
        enrol an attacker's authenticator. Stores a new pending secret (a second call
        replaces it) and returns it with its otpauth URI. Two-factor stays off until
        confirm. Rate-limited per client IP, 10 per minute.
      parameters:
      - description: current password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.totpSetupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.totpSetupResponse'
        "400":
          description: invalid request body
          schema:
            properties:
              error:
                type: string
            type: object
        "401":
          description: current password is incorrect; unauthorized
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: two-factor authentication is already on
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Start two-factor enrolment
      tags:
      - auth
  /admin/backfill:
    post:
      consumes:
      - application/json
      description: Queues a history backfill in the background for every enabled source
        that has one, or only for the named source even if disabled. The body is optional.
      parameters:
      - description: source to backfill; empty means every enabled source
        in: body
        name: body
        schema:
          properties:
            source:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "202":
          description: queued lists the sources queued
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
        "400":
          description: invalid request body; source has no backfill
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: unknown source
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Backfill price history now
      tags:
      - admin
  /admin/instruments:
    post:
      consumes:
      - application/json
      parameters:
      - description: market and currency must be a pair the seed lists use, e.g. US/USD
          or CRYPTO/TRY; symbol is trimmed, upper-cased and at most 32 characters;
          name is trimmed and at most 300 characters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/instrument.addRequest'
      produces:
      - application/json
      responses:
        "200":
          description: the new instrument, or the existing one for a known market
            and symbol
          schema:
            $ref: '#/definitions/instrument.instrumentResponse'
        "400":
          description: invalid request body; market and currency must be a supported
            pair; symbol is required; name is required; symbol must be at most 32
            characters; name must be at most 300 characters; symbol must not contain
            control characters; name must not contain control characters
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Add an instrument
      tags:
      - admin
  /admin/instruments/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: instrument id
        in: path
        name: id
        required: true
        type: integer
      - description: sector_override is one of the 11 sector keys (energy, materials,
          industrials, consumer_discretionary, consumer_staples, health_care, financials,
          information_technology, communication_services, utilities, real_estate);
          null or an omitted key clears the override
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/instrument.sectorOverrideRequest'
      produces:
      - application/json
      responses:
        "200":
          description: the instrument with its new override
          schema:
            $ref: '#/definitions/instrument.instrumentResponse'
        "400":
          description: invalid request body; sector_override must be a sector key;
            term deposits have no classification
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: instrument not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Set or clear an instrument's sector override
      tags:
      - admin
  /admin/providers:
    get:
      description: 'Each provider''s key status: whether it is set and its last 4
        characters, never the key. error is "undecryptable" when the stored key cannot
        be read.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.providerStatus'
            type: array
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: List data providers
      tags:
      - admin
  /admin/providers/{name}:
    put:
      consumes:
      - application/json
      parameters:
      - description: provider name
        enum:
        - finnhub
        - tiingo
        - evds
        in: path
        name: name
        required: true
        type: string
      - description: API key; empty clears it
        in: body
        name: body
        required: true
        schema:
          properties:
            api_key:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request body
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: unknown provider
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Set a provider API key
      tags:
      - admin
  /admin/providers/{name}/test:
    post:
      consumes:
      - application/json
      description: Makes one request to the provider with the body's api_key, or the
        stored key when the body has none. ok is false with the provider's reason
        in error when the key does not work. Rate limited to 10 requests per minute.
      parameters:
      - description: provider name
        enum:
        - finnhub
        - tiingo
        - evds
        in: path
        name: name
        required: true
        type: string
      - description: key to test; empty tests the stored key
        in: body
        name: body
        schema:
          properties:
            api_key:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              error:
                type: string
              ok:
                type: boolean
            type: object
        "400":
          description: invalid request body; stored key unreadable; not configured
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: unknown provider
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Test a provider API key
      tags:
      - admin
  /admin/registration:
    put:
      consumes:
      - application/json
      parameters:
      - description: open is required
        in: body
        name: body
        required: true
        schema:
          properties:
            open:
              type: boolean
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: invalid request body
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Open or close registration
      tags:
      - admin
  /admin/schedule:
    get:
      description: backfill_from is empty when the backfill starts at the earliest
        transaction.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.scheduleSettings'
      summary: Get schedule settings
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: catchup_enabled and backfill_enabled are required. An empty backfill_from
        means the earliest transaction.
      parameters:
      - description: schedule settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.scheduleSettings'
      produces:
      - application/json
      responses:
