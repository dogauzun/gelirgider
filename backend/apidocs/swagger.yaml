        "404":
          description: plan not found
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: plan has ended; plan is not due yet; plan changed, try again;
            no close on or before <date>; amount buys no unit at <close>
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Book a saving plan's next occurrence
      tags:
      - plans
