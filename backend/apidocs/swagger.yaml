              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Dividend forecast
      tags:
      - dividends
  /portfolios/{id}/dividends/timeline:
    get:
      description: Dividends received bucketed by month and year (only non-empty buckets,
        ascending) and totaled per instrument (net descending, then symbol), in the
        reporting currency at each transaction's own-date rate. A dividend with an
        instrument adds to gross (amount), tax (fee) and net; one without adds amount
        minus fee to interest only. A row whose currency has no rate on or before
        its date is left out and its currency listed in missing_rates. Amounts are
        2-decimal strings.
      parameters:
      - description: portfolio id
        in: path
        name: id
        required: true
        type: integer
      produces:
