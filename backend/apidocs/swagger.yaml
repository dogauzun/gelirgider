      description: 'Creates a user and seeds its default portfolio in the given locale.
        Does not sign in: no cookie is set, call login next. Rate-limited per client
        IP, 10 per minute.'
      parameters:
      - description: email, password and locale (tr or en, default tr)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.credentials'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.userResponse'
        "400":
          description: 'invalid request body; invalid email; email must be at most
            254 characters; password must not be only whitespace; password must be
            at least 8 characters; password must be at most 72 bytes; locale: must
            be one of tr, en'
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: setup_required; registration closed
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: 'user not found: an admin deleted the new user while it was
            being created'
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: email already registered
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Register a user
      tags:
      - auth
  /deposits/{id}:
    delete:
      description: Deletes the deposit, its buy, its funding cash deposit (when it
        was opened with fund true and the user has not deleted that row) and its hidden
        instrument, in one SQL transaction. A matured deposit (one with a sell) cannot
        be deleted. The interest row of a maturity is a plain dividend and is not
        touched here.
      parameters:
      - description: deposit id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: deleted
        "404":
          description: deposit not found
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: deposit is matured
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Delete a term deposit
      tags:
      - deposits
  /deposits/{id}/mature:
    post:
      description: 'Books a sell of the principal at price 1 on the maturity date
        (no realized profit or loss) and, when the gross interest is above zero, a
        dividend with no instrument for it: amount the gross interest, fee the stopaj,
        deposit currency, note the deposit''s name. Both rows are written in one SQL
        transaction. 409 when today is before the maturity date or the deposit is
        already matured.'
      parameters:
      - description: deposit id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.depositResponse'
        "404":
          description: deposit not found
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: deposit is not due yet; deposit is already matured
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Mature a term deposit
      tags:
      - deposits
  /deposits/{id}/renew:
    post:
      consumes:
      - application/json
      description: Opens a new deposit of the old principal plus its net interest
        (gross minus stopaj, 2 decimals), starting on the old maturity date in the
        same portfolio and currency, with a buy of that principal dated that day and
        renewed_from set to the old deposit. When the old deposit has no sell yet,
        its maturity is booked first, as POST /deposits/{id}/mature does. Everything
        is written in one SQL transaction. A deposit can be renewed once. rate and
        stopaj_rate are fractions (0.45 for 45%).
      parameters:
      - description: deposit id
        in: path
        name: id
        required: true
        type: integer
      - description: rate > 0 and at most 10, stopaj_rate from 0 up to but not including
          1, maturity_date after the old maturity date and at most 10 years later
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.renewRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.depositResponse'
        "400":
          description: 'invalid request body; rate|stopaj_rate: required; rate|stopaj_rate:
            must have at most 15 integer and 9 fraction digits; rate|stopaj_rate:
            must be a non-negative number with at most 15 integer and 9 fraction digits;
            rate: must be greater than 0 and at most 10; stopaj_rate: must be at least
            0 and below 1; maturity_date: must be YYYY-MM-DD; maturity_date: must
            be after start_date; maturity_date: must be at most 10 years after start_date'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: deposit not found
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: deposit is not due yet; deposit is already renewed
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Renew a term deposit
      tags:
      - deposits
  /export.zip:
    get:
      produces:
      - application/zip
      responses:
        "200":
          description: one <portfolio name>-transactions.csv per portfolio, as GET
            /portfolios/{id}/transactions.csv writes it; the id (then id-n) stands
            in for a name that is empty once cleaned for a file name or that another
            entry already has, compared ignoring case
          headers:
            Content-Disposition:
              description: attachment; filename=gelirgider-export-<yyyyMMddTHHmm>.csv.zip
              type: string
          schema:
            type: file
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Export every portfolio's transactions as a zip of CSV files
      tags:
      - transactions
  /health:
    get:
      description: Reports ok and the build version when the database answers. Needs
        no session.
      produces:
      - application/json
      responses:
        "200":
          description: status is ok, version is the build version (dev for an unstamped
            build)
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: status is degraded, error is database unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - health
  /imports:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/statement.importResponse'
            type: array
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: List statement imports
      tags:
      - imports
    post:
      consumes:
      - application/json
      description: Creates the import and all its transactions in one database transaction;
        the first invalid row rolls everything back. For broker csv the period is
        the committed rows' dates and the one sent is used only when it has no rows;
        when no row has a valid date, the first row's own error is returned. Each
        of the optional aliases is stored in the same database transaction as the
        user's pick for that symbol in this broker's statements, replacing an earlier
        pick; the next preview resolves an unknown symbol with it. Each of the optional
        names, the preview's names, is stored the same way as a learned fund name,
        replacing an earlier learned name but never a pick; a name sent with instrument_id
        0 or with two different instruments is stored for neither and removes a learned
        one. A row may be dated the day before period_start, the date of the preview's
        opening rows, or the day after period_end, when Midas books the interest of
        the month it prints. The body is capped at 2 MB instead of 64 KB.
      parameters:
      - description: the preview's broker, sha256, currency and period, the rows left
          checked, the instruments picked for unknown symbols, and the preview's names
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/statement.commitRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/statement.commitResponse'
        "400":
          description: 'invalid request body; broker: unknown broker; sha256: must
            be 64 lowercase hex characters; currency: must be one of TRY, USD, EUR;
            period_start|period_end: must be YYYY-MM-DD; period_start|period_end:
            must not be in the future; period_start|period_end: must be on or after
            1990-01-01; period_end: must not be before period_start; period_end: period
            must be shorter than a year (not for broker csv); rows[i].<field>: <message>
            (the transaction validation errors, e.g. rows[3].fee: must not exceed
            amount); rows[i].date: must be within <period_start> – <period_end> (or
            the day before period_start or the day after period_end); aliases: must
            have at most 200 entries; aliases[i].symbol: must be 1 to 200 characters;
            aliases[i].symbol: must not contain control characters; aliases[i].instrument_id:
            unknown instrument; names: must have at most 200 entries; names[i].symbol:
            must be 1 to 200 characters; names[i].symbol: must not contain control
            characters; names[i].instrument_id: unknown instrument'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: portfolio not found
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: already_imported (import_id, period_start and period_end name
            the earlier import of the same period in this portfolio, to undo first,
            also when the same file is committed again; when this file is already
            imported with another period or currency, e.g. a CSV committed again with
            other rows, or into another of the user's portfolios, import_id, portfolio_id
            and portfolio_name name that import and its portfolio instead)
          schema:
            properties:
              error:
                type: string
              import_id:
                type: integer
              period_end:
                type: string
              period_start:
                type: string
              portfolio_id:
                type: integer
              portfolio_name:
                type: string
            type: object
        "413":
          description: 'rows: larger than 2 MB'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Commit a reviewed statement
      tags:
      - imports
  /imports/{id}:
    delete:
      parameters:
      - description: import id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: deleted with its transactions
        "404":
          description: import not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Undo a statement import
      tags:
      - imports
  /imports/funds:
    post:
      consumes:
      - application/json
      parameters:
      - description: fund code, three letters or digits; trimmed and upper-cased
        in: body
        name: body
        required: true
        schema:
          properties:
            code:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: the known or newly created TEFAS fund
          schema:
            $ref: '#/definitions/statement.fundResponse'
        "400":
          description: 'invalid request body; code: must be a TEFAS fund code'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: fund not found
          schema:
            properties:
              error:
                type: string
            type: object
        "429":
          description: 'too many requests: the client IP asked TEFAS about 20 codes
            this minute, here and in previews together'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Look up a TEFAS fund by code
      tags:
      - imports
  /imports/parse:
    post:
      consumes:
      - multipart/form-data
      description: 'Reads an uploaded PDF statement (a CSV file for broker csv) and
        returns the proposed rows for review. Writes no user data; it may add shared
        market data: the instruments and prices described below, and the prices and
        FX rates fetched to price an opening buy. A TEFAS row whose fund code is no
        instrument is asked about on TEFAS, at most 10 codes a request and within
        the client IP''s 20 TEFAS lookups a minute shared with /imports/funds, and
        the fund TEFAS confirms is added; a code not asked stays unknown_instrument.
        A trade or dividend in BIST whose symbol is no instrument, such as a share
        delisted since, is looked up again after the BIST bulletin of its date is
        synced, fetching at most 5 bulletins a request and within the client IP''s
        10 bulletin fetches a minute; the sync adds the symbols that bulletin lists
        as instruments, shared market data like their prices. The TEFAS lookups and
        bulletin syncs of one request share a 15 s deadline; none starts after it,
        and the rows they would have resolved stay unknown_instrument. With broker
        auto, a PDF goes through every PDF parser in key order and the first that
        accepts it picks the broker: the response''s broker is that key, and everything
        below uses it as if it had been sent. A symbol that resolves to no instrument
        takes the instrument the user picked for it in an earlier commit of the same
        broker (commit''s aliases); such a row has resolved_by "alias" and names that
        instrument in instrument_symbol and instrument_name. A holding resolves through
        the same pick, so its reconciliation entry and opening follow it. The optional
        picks are the instruments the user picked in this preview so far, in the shape
        of commit''s aliases: for this request only, each resolves its symbol like
        a stored pick and wins over one, so rows, openings and the reconciliation
        follow it; nothing is stored. When the statement holds more of an instrument
        at period end than the portfolio would with the ok rows, and the portfolio
        has no transaction of it before period_start, an opening buy of the difference
        dated the day before period_start is proposed (opening true), priced with
        the average cost the statement prints for the holding when it is in the instrument''s
        currency and the preview has no buy of it (cost_price true), else with the
        stored price on or before that date, for a BIST instrument also once the BIST
        bulletin of the last weekday on or before that date is synced (one sync a
        request, within the client IP''s 10 bulletin fetches a minute and the opening
        fetches'' deadline), else the statement''s own price when the holding is in
        the instrument''s currency (approximate_price true), else returned as an error
        row with code opening_price; one opening deposit per currency pays for the
        priced buys. When the statement lists holdings and the portfolio would hold
        more of an instrument at period end than the statement, holding it before
        period_start, a closing sell of the difference, at most what it held the day
        before period_start, is proposed on that day (closing true), priced like an
        opening buy but never with the average cost, else returned as an error row
        with code closing_price; one closing withdrawal per currency (closing true)
        takes the priced sells'' proceeds out again, rounded down to the cent. Closing
        rows are left out of the reconciliation, as the page starts the sells unchecked
        and books the withdrawal in step with the checked ones. Nothing is proposed
        while any buy or sell row is unknown_instrument, unless the units of every
        such symbol''s buy and sell rows net to zero. The reconciliation includes
        them. names lists each fund name the balances print (Garanti fund statements)
        with the instrument of its code, for the commit''s names; its instrument_id
        is 0 when they print it for two codes or its code resolves to no instrument.
        A symbol that neither an instrument nor a pick resolves takes the one instrument
        of the learned names that equal it, start with it or that it starts with,
        with resolved_by "name" and instrument_symbol and instrument_name set; matches
        of more than one instrument leave it unknown_instrument, and so does a symbol
        that is one of the statement''s holding codes or that matches one of its own
        balance names the same way (the parser leaves such a name unmapped only when
        it names two funds). A garanti TEFAS row''s symbol none of that resolves,
        and that is neither such a holding code nor such a balance name, takes the
        one TEFAS fund whose name it is cut or abbreviated from: word by word, GPY
        and GP read as GARANTİ PORTFÖY and 1., 2., 3. as BİRİNCİ, İKİNCİ, ÜÇÜNCÜ,
        each of its words starts the fund name''s word in the same place, case and
        punctuation ignored. A fund of the same words, else of the same words but
        a cut last one, wins over the others; it has resolved_by "name" too, and two
        funds of the closest kind leave it unknown_instrument. The optional names,
        in the shape of the response''s names, are fund names other statements print,
        such as the later statements of the same upload batch: for this request only,
        each is a learned name, winning over a stored one of the same name, so a fund
        renamed on TEFAS that an earlier statement names only by its old name resolves;
        an entry of instrument_id 0 is ignored and nothing is stored. The body is
        capped at 5 MB instead of 64 KB.'
      parameters:
      - description: broker key, or auto to detect the broker of a PDF
        enum:
        - auto
        - midas
        - csv
        - garanti
        - garanti_yatirim
        in: formData
        name: broker
        required: true
        type: string
      - description: portfolio id
        in: formData
        name: portfolio_id
        required: true
        type: integer
      - description: statement PDF, or CSV (UTF-8, else read as Windows-1254) for
          broker csv, at most 5 MB
        in: formData
        name: file
        required: true
        type: file
      - description: 'JSON array of {symbol, instrument_id}, at most 200 entries:
          the instruments picked in this preview'
        in: formData
        name: picks
        type: string
      - description: 'JSON array of {symbol, instrument_id}, at most 200 entries:
          fund names other statements print, taken as learned names'
        in: formData
        name: names
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/statement.previewResponse'
        "400":
          description: 'file: invalid upload; broker: unknown broker; portfolio_id:
            must be a number; file: required; file: not a PDF; file: not a readable
            PDF; file: no period row found: not a Midas statement; file: not a garanti
            fund statement; file: not a garanti_yatirim statement; file: not a supported
            statement (broker auto); file: not a CSV; file: not a readable CSV; file:
            not a csv statement; file: no rows; file: more than 5000 rows; picks:
            must be a JSON array of symbol and instrument_id; picks: must have at
            most 200 entries; picks[i].symbol: must be 1 to 200 characters; picks[i].symbol:
            must not contain control characters; picks[i].instrument_id: unknown instrument;
            names: must be a JSON array of symbol and instrument_id; names: must have
            at most 200 entries; names[i].symbol: must be 1 to 200 characters; names[i].symbol:
            must not contain control characters; names[i].instrument_id: unknown instrument'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: portfolio not found
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: 'already_imported (import_id is the user''s earlier import
            of this file, portfolio_id and portfolio_name the portfolio it is in:
            this one or another of the user''s)'
          schema:
            properties:
              error:
                type: string
              import_id:
                type: integer
              portfolio_id:
                type: integer
              portfolio_name:
                type: string
            type: object
        "413":
          description: 'file: larger than 5 MB'
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Parse a broker statement
      tags:
      - imports
