  /portfolios/{id}/cash-gaps:
    get:
      description: 'Per portfolio and currency, every day the cash balance reaches
        a new low below zero, with the extra shortfall that day: the deposits that,
        recorded, keep the cash from going negative (ADR 0011). Ordered by portfolio,
        date, currency; empty when the cash never goes below zero.'
      parameters:
      - description: numeric id or `all`
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
