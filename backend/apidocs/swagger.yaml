  /portfolios/{id}/dividends/forecast:
    get:
      description: 'Expected dividends of the twelve months from next month: each
        dividend recorded since the first day of the month eleven months ago, repeated
        a year later at its per-share amount times the quantity held now, replaced
        by the stored ex-dates (planned) that fall in the same period. Stopaj is pre-filled
        per market like the expected list. net_reporting is the net in the reporting
        currency at today''s rate (null, and the currency listed in missing_rates,
        when it has no rate); months sums it per period, zero-filled, rows without
        a rate left out. Rows are ordered by period, date, instrument id; date is
        null for a projected row. The all scope is not supported.'
      parameters:
      - description: portfolio id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
