    get:
      description: 'The savings goal of the portfolio: amount to reach in unit by
        target_date. `all` is the goal of the all-portfolios view and is stored apart
        from every portfolio''s goal.'
      parameters:
      - description: numeric id or `all`
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.goalBody'
        "404":
          description: portfolio not found; goal not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Read a portfolio's goal
      tags:
      - portfolios
    put:
      consumes:
      - application/json
      description: Replaces the goal of the scope and answers the stored goal. unit
        is nominal (the reporting currency), real (the amount at the prices of the
        day the goal is set, only with a TRY reporting currency) or usd (only with
        a non-USD reporting currency). target_date is YYYY-MM-DD, in a later calendar
        month than today and at most 50 years ahead (Europe/Istanbul).
      parameters:
      - description: numeric id or `all`
        in: path
        name: id
        required: true
        type: string
      - description: amount a positive decimal; unit one of nominal, real, usd
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.goalBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.goalBody'
        "400":
          description: 'invalid request body; amount: must be a positive number; unit:
            must be one of nominal, real, usd; unit: real needs a TRY reporting currency;
            unit: usd needs a non-USD reporting currency; target_date: must be in
            a later month than today; target_date: must be at most 50 years after
            today'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: portfolio not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Set a portfolio's goal
      tags:
      - portfolios
  /portfolios/{id}/history:
    get:
      description: One point per day from `from` to `to`, in the reporting currency.
        A `from` before the first transaction moves to it, unless that transaction
        is after `to`. Without `from` the range starts at the first transaction (at
        most 3660 days back); a `to` after today is clamped to today. The three returns
        are null when undefined for the range; benchmark is null when no benchmark
        was requested, and its returns are null when it has no level on or before
        the first point. Each point's twr is the time-weighted return from the first
        point to that one, ending on returns.twr, and null on every point when returns.twr
        is null; benchmark_twr is the same for the benchmark's shadow series. inflation
        is the TUFE change over the range, whatever the benchmark, null unless the
        reporting currency is TRY or when TUFE has no level on or before the first
        point; inflation_estimated_from is the first extrapolated day of it, null
        when none.
      parameters:
      - description: numeric id or `all`
        in: path
        name: id
        required: true
        type: string
      - description: first day, YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: last day, YYYY-MM-DD, default today
        in: query
        name: to
        type: string
      - description: USD, EUR, XU100, TUFE, GOLD, or instrument:<id> for an instrument
          with a transaction in the scope
        in: query
        name: benchmark
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.historyResponse'
        "400":
          description: unknown benchmark; to must be YYYY-MM-DD; from must be YYYY-MM-DD;
            from must not be after to; range exceeds 3660 days
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: portfolio not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Portfolio value history
      tags:
      - portfolios
  /portfolios/{id}/instruments/{instrument_id}/history:
    get:
      description: One point per day from `from` to `to` for one instrument of the
        portfolio, in the instrument's own currency (no fx). A `from` before the instrument's
        first transaction moves to it, unless that transaction is after `to`. Without
        `from` the range starts at the instrument's first transaction (at most 3660
        days back); a `to` after today is clamped to today.
      parameters:
      - description: portfolio id
        in: path
        name: id
        required: true
        type: integer
      - description: instrument id
        in: path
        name: instrument_id
        required: true
        type: integer
      - description: first day, YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: last day, YYYY-MM-DD, default today
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.positionHistoryResponse'
        "400":
          description: to must be YYYY-MM-DD; from must be YYYY-MM-DD; from must not
            be after to; range exceeds 3660 days
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: portfolio not found; instrument not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Position history
      tags:
      - portfolios
  /portfolios/{id}/plans:
    get:
      description: Soonest next_date first. status is ended when the next occurrence
        is past the end date, else due from the next occurrence's date, else active.
        symbol and market are null for a cash deposit plan.
      parameters:
      - description: portfolio id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.planResponse'
            type: array
        "404":
          description: portfolio not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: List a portfolio's saving plans
      tags:
      - plans
    post:
      consumes:
      - application/json
      description: 'A monthly plan: a buy of the instrument, or with no instrument
        a cash deposit, of amount on day_of_month from start_date to end_date (open-ended
        when omitted). A day past the month''s end falls on its last day. next_date,
        the first occurrence on or after start_date, is where the plan stands. A buy
        plan''s amount is in the instrument''s currency; a deposit plan takes currency
        from the body. With fund true the amount is booked as a cash deposit before
        each buy. Decimals are strings with at most 15 integer and 9 fraction digits.'
      parameters:
      - description: portfolio id
        in: path
        name: id
        required: true
        type: integer
      - description: instrument_id of a non-DEPOSIT instrument or none; currency required
          without an instrument; amount > 0; day_of_month 1 to 31; start_date from
          1990-01-01 to one year after today; end_date on or after start_date or omitted
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.planRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.planResponse'
        "400":
          description: 'invalid request body; instrument_id: unknown instrument; currency:
            must match instrument currency (<currency>); currency: must be one of
            TRY, USD, EUR; amount: required; amount: must have at most 15 integer
            and 9 fraction digits; amount: must be a non-negative number with at most
            15 integer and 9 fraction digits; amount: must be a positive number; day_of_month:
            must be between 1 and 31; start_date: must be YYYY-MM-DD; start_date:
            must be on or after 1990-01-01; start_date: must be at most 1 year after
            today; end_date: must be YYYY-MM-DD; end_date: must be on or after start_date;
            note: must be at most 500 characters; note: must not contain control characters'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: portfolio not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Create a saving plan
      tags:
      - plans
  /portfolios/{id}/plans/due:
    get:
      description: 'The portfolio''s plans whose next_date is today or past and that
        have not ended, oldest next_date first. date is the next_date and missed the
        number of occurrences from it through today, or through end_date when that
        is earlier (1 when it is the only one). For a buy plan price is the close
        on or before date (null when there is none), quantity the amount divided by
        price rounded down to the market''s scale (BIST 0, US 4, TEFAS 6, CRYPTO 8,
        GOLD 4) and booked_amount quantity times price to 2 decimals; quantity and
        booked_amount are null without a close. For a deposit plan instrument_id,
        symbol, market, price, price_date and quantity are null and booked_amount
        is the amount. Nothing is booked: POST /plans/{id}/book books one occurrence
        and POST /plans/{id}/skip skips it. The all scope is not supported.'
      parameters:
      - description: portfolio id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.duePlanResponse'
            type: array
        "404":
          description: portfolio not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: List due saving plans
      tags:
      - plans
  /portfolios/{id}/projection:
    get:
      description: 'Projects the scope''s value month by month from the next month
        through the target month, with the 25th, 50th and 75th percentile of the monthly
        time-weighted returns of the last 36 full calendar months (nearest rank) and
        the median net external flow of the last 12 full months. Month values are
        in the goal''s unit: real is the reporting currency at the prices of the day
        the goal was set: a nominal value is multiplied by the TUFE level of that
        day over today''s level and divided by the TUFE rate of the last 12 months
        compounded for each month ahead, usd by today''s USD rate. months is empty,
        with history_months counting the usable months, when fewer than 6 full months
        have a return, and empty with history_months 0 when the scope has no history
        or the unit lacks its TUFE level or USD rate. reached_at is the first month
        of the median path at or above the amount, the current month when today''s
        value already is at the amount; monthly_gap is the extra monthly flow in the
        reporting currency, rounded up, that the median path needs to reach the amount
        by the target month, null when reached_at is set. progress is today''s value
        in the unit divided by the amount.'
      parameters:
      - description: numeric id or `all`
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.projectionResponse'
        "404":
          description: portfolio not found; goal not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Projection of a portfolio's goal
      tags:
      - portfolios
  /portfolios/{id}/returns/periods:
    get:
      description: 'One bucket per calendar month and per calendar year, from the
        first transaction (at most 3660 days back) to today, oldest first. A bucket''s
        returns are what the history endpoint returns for the same from..to: a year''s
        from..to is the calendar-year preset''s range (YYYY-01-01..YYYY-12-31) clamped
        to the first transaction and to today, a month''s likewise. The first and
        the current bucket are partial. A bucket''s benchmark is null without the
        parameter, or when the benchmark has no level on some day of the bucket.'
      parameters:
      - description: numeric id or `all`
        in: path
        name: id
        required: true
        type: string
      - description: USD, EUR, XU100, TUFE, GOLD, or instrument:<id> for an instrument
          with a transaction in the scope
        in: query
        name: benchmark
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.periodsResponse'
        "400":
          description: unknown benchmark
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: portfolio not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Portfolio returns per calendar month and year
      tags:
      - portfolios
  /portfolios/{id}/summary:
    get:
      description: Open and closed positions with cash and totals as of today (Europe/Istanbul),
        converted into the reporting currency. positions_value and cost_basis total
        the open positions, each rounded once; day_change totals the open positions'
        day move plus the move on the price date of closed positions sold out on or
        after it, and is null when no such position has a previous close and a rate.
        unrealized_pl, realized_pl and fx_pl are null when they cannot be converted;
        missing_rates names the excluded currencies. stats totals deposits, withdrawals,
        fees, dividends and interest per currency and, when every currency converts,
        in the reporting currency. net_contribution, dividends_net and each position's
        total_pl_reporting are worked out unrounded and rounded once.
      parameters:
      - description: numeric id or `all`
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.summaryResponse'
        "404":
          description: portfolio not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Portfolio summary
      tags:
      - portfolios
  /portfolios/{id}/transactions:
    get:
      parameters:
      - description: portfolio id
        in: path
        name: id
        required: true
        type: integer
      - description: page size, default 100, clamped to 500
        in: query
        name: limit
        type: integer
      - description: cursor from a previous page's X-Next-Cursor, <YYYY-MM-DD>,<id>
        in: query
        name: before
        type: string
      - description: 'comma-separated types: buy, sell, dividend, deposit, withdrawal,
          fee'
        in: query
        name: type
        type: string
      - description: only this instrument's transactions
        in: query
        name: instrument_id
        type: integer
      - description: only this import's transactions (an id from GET /imports), or
          none for those entered by hand; another user's import id matches nothing
        in: query
        name: import_id
        type: string
      - description: only transactions on or after this date, YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: only transactions on or before this date, YYYY-MM-DD
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: newest first
          headers:
            X-Next-Cursor:
              description: cursor for the next page as ?before=; absent on the last
                page
              type: string
          schema:
            items:
              $ref: '#/definitions/transaction.transactionResponse'
            type: array
        "400":
          description: 'limit must be a positive integer; before: must be <YYYY-MM-DD>,<id>;
            type: invalid; instrument_id: must be a positive integer; import_id: must
            be a positive integer or none; from must be YYYY-MM-DD; to must be YYYY-MM-DD;
            from must not be after to'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: portfolio not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: List a portfolio's transactions
      tags:
      - transactions
    post:
      consumes:
      - application/json
      parameters:
      - description: portfolio id
        in: path
        name: id
        required: true
        type: integer
      - description: decimals are strings; quantity and price for buy and sell, amount
          for the rest; instrument_id required for buy and sell, optional for dividend
          (none is interest income, currency as for a deposit), not allowed for the
          rest
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/transaction.Request'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/transaction.transactionResponse'
        "400":
          description: 'invalid request body; type: must be one of buy, sell, dividend,
            deposit, withdrawal, fee; date: must be YYYY-MM-DD; date: must not be
            in the future; date: must be on or after 1990-01-01; instrument_id: required
            for <type>; instrument_id: not allowed for <type>; instrument_id: unknown
            instrument; quantity|price|amount|fee: required; quantity|price|amount|fee:
            must have at most 15 integer and 9 fraction digits; quantity|price|amount|fee:
            must be a positive|non-negative number with at most 15 integer and 9 fraction
            digits; amount: must be 0 when price is 0; fee: must not exceed amount;
            fee: must be 0 for a fee transaction; currency: must be one of TRY, USD,
            EUR; currency: must match instrument currency (<currency>); note: must
            be at most 500 characters; note: must not contain control characters'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: portfolio not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Create a transaction
      tags:
      - transactions
  /portfolios/{id}/transactions.csv:
    get:
      parameters:
      - description: portfolio id
        in: path
        name: id
        required: true
        type: integer
      - description: 'comma-separated types: buy, sell, dividend, deposit, withdrawal,
          fee'
        in: query
        name: type
        type: string
      - description: only this instrument's transactions
        in: query
        name: instrument_id
        type: integer
      - description: only this import's transactions (an id from GET /imports), or
          none for those entered by hand; another user's import id matches nothing
        in: query
        name: import_id
        type: string
      - description: only transactions on or after this date, YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: only transactions on or before this date, YYYY-MM-DD
        in: query
        name: to
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: columns date,type,symbol,quantity,price,amount,fee,currency,note,market;
            quantity and price empty outside buy and sell; market empty without an
            instrument
          headers:
            Content-Disposition:
              description: attachment; filename=portfolio-<id>-transactions.csv
              type: string
          schema:
            type: string
        "400":
          description: 'type: invalid; instrument_id: must be a positive integer;
            import_id: must be a positive integer or none; from must be YYYY-MM-DD;
            to must be YYYY-MM-DD; from must not be after to'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: portfolio not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Export a portfolio's transactions as CSV
      tags:
      - transactions
  /setup/admin:
    post:
      consumes:
      - application/json
      description: Needs the one-time setup token from the server log. Sets the `session`
        cookie. Rate-limited per client IP, 10 per minute.
      parameters:
      - description: setup token, email, password and locale (tr or en, default tr)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.setupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Set-Cookie:
              description: session=<id>; Path=/; Expires=<30 days>; HttpOnly; SameSite=Lax;
                Secure when COOKIE_SECURE=true
              type: string
          schema:
            $ref: '#/definitions/auth.userResponse'
        "400":
          description: 'invalid request body; invalid email; email must be at most
            254 characters; password must not be only whitespace; password must be
            at least 8 characters; password must be at most 72 bytes; locale: must
            be one of tr, en'
          schema:
            properties:
              error:
                type: string
            type: object
        "403":
          description: invalid setup token; invalid credentials
          schema:
            properties:
              error:
                type: string
            type: object
        "409":
          description: setup already done; email already registered
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Create the first admin
      tags:
      - setup
  /setup/status:
    get:
      description: needs_setup is true while no admin exists. Needs no session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              needs_setup:
                type: boolean
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Setup status
      tags:
      - setup
  /transactions/{id}:
