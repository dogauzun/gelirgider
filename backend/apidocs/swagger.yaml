  /plans/{id}/book:
    post:
      description: Books the occurrence dated next_date and moves next_date to the
        next one. A buy plan books a buy of quantity (the amount divided by the close
        on or before next_date, rounded down to the market's scale) at that close,
        amount quantity times close to 2 decimals, fee 0, in the instrument's currency;
        with fund set a deposit of the booked amount goes in before it. A deposit
        plan books a deposit of its amount. Every row carries the plan's note and
        is dated next_date. The rows and the move are written in one SQL transaction.
        Answers with the plan, so the caller sees the new next_date and status.
      parameters:
      - description: plan id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
