      - description: the whole transaction, as on create; instrument_id is optional
          for dividend (none is interest income)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/transaction.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/transaction.transactionResponse'
        "400":
          description: 'invalid request body; type: must be one of buy, sell, dividend,
            deposit, withdrawal, fee; date: must be YYYY-MM-DD; date: must not be
            in the future; date: must be on or after 1990-01-01; instrument_id: required
            for <type>; instrument_id: not allowed for <type>; instrument_id: unknown
            instrument; quantity|price|amount|fee: required; quantity|price|amount|fee:
            must have at most 15 integer and 9 fraction digits; quantity|price|amount|fee:
            must be a positive|non-negative number with at most 15 integer and 9 fraction
            digits; amount: must be 0 when price is 0; fee: must not exceed amount;
            fee: must be 0 for a fee transaction; currency: must be one of TRY, USD,
            EUR; currency: must match instrument currency (<currency>); note: must
            be at most 500 characters; note: must not contain control characters;
            deposit rows are changed through the deposit routes'
          schema:
            properties:
              error:
                type: string
            type: object
        "404":
          description: transaction not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Update a transaction
      tags:
      - transactions
