      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.dividendTimelineResponse'
        "404":
          description: portfolio not found
          schema:
            properties:
              error:
                type: string
            type: object
        "500":
          description: internal error
          schema:
            properties:
              error:
                type: string
            type: object
      summary: Dividend timeline
      tags:
      - dividends
  /portfolios/{id}/dividends/upcoming:
    get:
      description: 'Stored ex-dates after today for the quantity the portfolio holds
        now, soonest first; none when it holds none. Not matched against recorded
        dividends and not dismissable: those apply only after the ex-date. Stopaj
        is pre-filled per market like the expected list. The all scope is not supported.'
      parameters:
      - description: portfolio id
        in: path
        name: id
        required: true
