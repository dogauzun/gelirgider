version: "2"
linters:
  default: none
  enable:
    - dupl
    - forbidigo
    - funlen
    - goconst
    - gocognit
    - nestif
    - noctx
    - revive
    - unparam
    - usestdlibvars
  settings:
    dupl:
      threshold: 45
    forbidigo:
      forbid:
        - pattern: '^time\.LoadLocation$'
          msg: use price.Istanbul
        - pattern: '^strings\.Repeat$'
          msg: use db.InList
        - pattern: '^price\.MinDate$'
          msg: use price.CheckDate
        - pattern: '^price\.Istanbul$'
          msg: use the price day helpers
    funlen:
      lines: 100
      statements: -1
      ignore-comments: true
    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-string-values: ['^(TRY|USD|EUR)$']
    gocognit:
      min-complexity: 30
    nestif:
      min-complexity: 10
    revive:
      rules:
        - name: argument-limit
          arguments: [6]
        - name: file-length-limit
          arguments: [{max: 1000, skipComments: true}]
    usestdlibvars:
      time-layout: true
  exclusions:
    rules:
      - path: internal/price/price\.go
        linters: [forbidigo]
      - path: internal/us/us(_test)?\.go
        linters: [forbidigo]
      # Alias, key and sample-data tables: the repeated strings are data, not shared names.
      - path: internal/statement/csv/csv\.go|internal/instrument/sector\.go|internal/demo/demo\.go
        linters: [goconst]
      - path: _test\.go$
        linters: [dupl, funlen, goconst, gocognit, noctx]
      - path: (_test\.go|internal/db/db\.go)$
        linters: [forbidigo]
        text: use db\.InList
      # A test file groups the tests of a whole route, which no split shortens.
      - path: _test\.go$
        linters: [revive]
        text: file-length-limit
      # Tests use MinDate as the boundary value they probe.
      - path: _test\.go$
        linters: [forbidigo]
        text: use price\.CheckDate
      # The scheduler clock, the manual run's clock and the TEFAS period
      # window want the zone itself, not a day boundary; tests build
      # fixtures in it.
      - path: internal/scheduler/|internal/server/schedule\.go|internal/tefas/tefas\.go|_test\.go$
        linters: [forbidigo]
        text: use the price day helpers
