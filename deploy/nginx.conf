# Upstream backend service. Overridden at container start with:
#   docker run -e BACKEND_UPSTREAM=host:port ...
# (envsubst runs on this template before nginx starts, see frontend.Dockerfile)
#
# Client-IP chain in production (deploy/compose.yml): Caddy is the only
# service with a published port, so it sees the real client and sets
# X-Forwarded-For to that address, discarding anything the client sent.
# This nginx proxy appends Caddy's address via proxy_add_x_forwarded_for, so
# the backend gets "client, caddy" and, with TRUST_PROXY=true and
# TRUSTED_PROXY_HOPS=2, takes the entry two from the right as the client IP.
# Run on its own, this image keeps whatever X-Forwarded-For the client sent
# and appends the client's address: TRUSTED_PROXY_HOPS=1 reads that last one.

# Cache-Control per path, sent by the server-level add_header below so no
# location needs its own add_header. Vite content-hashes everything under
# /assets/, so a URL there never changes content. Everything else, index.html
# included (also when try_files falls back to it), revalidates on every load so
# a deploy shows up at once. /api/ gets none here: the backend and Caddy own it
# (an empty value makes add_header send nothing).
map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/    "";
    default    "no-cache";
}

server {
    # 8080: nginx-unprivileged runs as a non-root user (frontend.Dockerfile).
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers live here, not in the Caddyfile, so they also cover the
    # image run on its own. Only HSTS stays in Caddy, the layer that terminates
    # TLS. No location below may use add_header: that drops these headers there.
    # Scripts only from files on this origin: keep index.html free of inline
    # scripts. React style props go through the CSSOM, which style-src allows.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_control always;

    location /api/ {
        # Above the backend's 5 MB statement upload limit so its JSON 413 wins.
        client_max_body_size 6m;
        proxy_pass http://${BACKEND_UPSTREAM}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx's stock mime.types has no webmanifest entry, so it would go out as
    # application/octet-stream. default_type only, no add_header (see above).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Neither .md nor an extensionless file is in mime.types: show the license
    # and the notices as UTF-8 text instead of a download. No add_header (see
    # above).
    location ~ ^/(LICENSE|THIRD_PARTY_NOTICES\.md)$ {
        default_type text/plain;
        charset utf-8;
    }

    # The container health check (deploy/compose.yml); not logged, so it does
    # not fill the access log every 30 s. return needs no add_header (see above).
    location = /healthz {
        access_log off;
        return 204;
    }

    location / {
        try_files $uri /index.html;
    }
}
